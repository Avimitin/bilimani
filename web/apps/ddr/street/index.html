<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>bilimani DDR · Street Session</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="frame">
  <div class="paper paper-top" aria-hidden="true"></div><div class="paper paper-left" aria-hidden="true"></div><div class="paper paper-right" aria-hidden="true"></div><div class="paper paper-bottom" aria-hidden="true"></div>
  <header><div class="stream-identity"><span class="live-stamp">LIVE FROM THE FLOOR</span><div id="streamer-name" class="streamer-name">等待主播连接</div></div><div class="stream-heading"><small>ON AIR / 正在直播</small><div id="stream-title" class="stream-title">等待直播标题</div></div></header>
  <section class="game-window" aria-label="1280×720 游戏画面透明区域"></section>
  <div class="edge-note" aria-hidden="true">NO STANDING STILL / ↓ ↑ ← →</div>
  <img class="graffiti" src="./art/dance-dance-revolution.png" alt="Dance Dance Revolution 涂鸦" width="1536" height="1024">
  <section class="camera-window" aria-label="1280×720 摄像头画面透明区域，OBS 显示尺寸 544×306"></section>
  <img class="camera-spray" src="./art/camera-spray.svg" alt="" aria-hidden="true">
  <div class="camera-tag" aria-hidden="true">FLOOR CAM<span>MOVE YOUR SOUL</span></div>
  <aside><section class="queue"><h2>UP NEXT<span id="count">00</span></h2><div class="current-label">ON DECK / 点歌现场</div><div id="current" class="current">等待点歌</div><ol id="queue"></ol><p id="empty">THE FLOOR IS YOURS.<br><small>发送「点歌 曲名」加入队列</small></p></section><section class="chat"><h2>WORD ON THE STREET</h2><div id="feed"></div></section></aside>
  <footer><div class="song"><small id="phase">WAITING FOR DANCERS</small><h1 id="title">LET’S MOVE.</h1><p id="artist">等待游戏选曲</p></div><div class="song-details"><div id="charts" class="charts"></div><div id="players" class="players">PLAYER —</div></div></footer>
  <div id="status" class="status">等待游戏连接</div>
  <section id="choices" class="choices" hidden><h2>PICK YOUR TRACK</h2><div id="candidates"></div></section>
</main><script type="module" src="./main.ts"></script></body></html>
