[package]
name = "chart-requester"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bilibili chart requests for beatmania IIDX"

[lib]
name = "chart_requester"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
encoding_rs = "0.8"
unicode-normalization = "0.1"
nucleo-matcher = "0.3"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
brotli = "8"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
