[package]
name = "chart-requester"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Bilibili chart requests for beatmania IIDX"

[lib]
name = "chart_requester"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
egui = "0.34.1"
ouroboros-ui = { git = "https://github.com/Type-zero-labs/ouroboros-ui", rev = "c390d7deffa7955e28b2e3bcb9c22ac0899a261b" }
encoding_rs = "0.8"
unicode-normalization = "0.1"
nucleo-matcher = "0.3"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
brotli = "8"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync", "fs", "io-util"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D9", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Graphics_Gdi"] }
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
