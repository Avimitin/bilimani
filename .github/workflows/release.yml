name: Build and release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 packages
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select Rust toolchain' }

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node and frontend
        run: |
          node --version
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: ./scripts/build.ps1 -CargoArgs @('test', '--workspace', '--locked', '--all-targets')

      - name: Clippy
        run: ./scripts/build.ps1 -CargoArgs @('clippy', '--workspace', '--locked', '--all-targets', '--', '-D', 'warnings')

      - name: Build and package
        id: package
        run: ./scripts/package.ps1

      - name: Upload IIDX ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bilimani-iidx-windows-x64
          path: ${{ steps.package.outputs.iidx_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload DDR ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bilimani-ddr-windows-x64
          path: ${{ steps.package.outputs.ddr_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download IIDX ZIP artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bilimani-iidx-windows-x64
          path: dist

      - name: Download DDR ZIP artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bilimani-ddr-windows-x64
          path: dist

      - name: Publish both ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
