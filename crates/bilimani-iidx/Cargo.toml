[package]
name = "bilimani-iidx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IIDX runtime catalog, selection and telemetry HTTP bridge"

[lib]
name = "bilimani_iidx"
crate-type = ["cdylib", "rlib"]

[dependencies]
bilimani-api = { path = "../bilimani-api" }
bilimani-queue = { path = "../bilimani-queue" }
bilimani-menu = { path = "../bilimani-menu" }
csv = "1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
nucleo-matcher = "0.3"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync", "fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security"] }
