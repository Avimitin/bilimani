[package]
name = "bilimani-menu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-game queue controls with a Spice D3D9 renderer"

[dependencies]
bilimani-queue = { path = "../bilimani-queue" }
egui = "0.34.1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct3D9", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
